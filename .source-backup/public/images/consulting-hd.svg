<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Consulting Group Professional Logo -->
  <defs>
    <linearGradient id="consultingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Professional icon -->
  <rect x="5" y="10" width="40" height="40" rx="8" fill="url(#consultingGradient)"/>
  <path d="M15 25 L25 35 L35 20" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Company text -->
  <text x="55" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">Espabílate</text>
  <text x="55" y="40" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Consulting Group</text>
</svg>