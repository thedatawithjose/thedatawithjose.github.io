<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Coursera Logo with official branding -->
  <defs>
    <linearGradient id="courseraGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0056D3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4285F4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Coursera "C" icon -->
  <circle cx="30" cy="30" r="20" fill="url(#courseraGradient)"/>
  <path d="M35 20 C40 20 45 25 45 30 C45 35 40 40 35 40" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Coursera text -->
  <text x="60" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0056D3">Coursera</text>
</svg>