name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'
  CACHE_KEY: 'node-modules'

jobs:
  # Security and Quality Checks
  security-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true
      
    - name: Lint check
      run: npm run lint
      continue-on-error: true

  # Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    needs: security-check
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm run test:run
      continue-on-error: true
      
    - name: Build application
      run: npm run build
      env:
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
        NODE_ENV: production
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: ./out
        retention-days: 1

  # Deploy to GitHub Pages
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: production
      url: https://thedatawithjose.github.io
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-files
        path: ./out
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./out
        cname: datawithjose.tech
        force_orphan: true
        
    - name: Health check after deployment
      run: |
        echo "Waiting for deployment to be available..."
        sleep 30
        curl -f https://thedatawithjose.github.io/health || echo "Health check failed, but deployment completed"
      continue-on-error: true

  # Post-deployment monitoring
  post-deploy-check:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Check site availability
      run: |
        echo "Checking site availability..."
        curl -f -s -o /dev/null https://thedatawithjose.github.io || exit 1
        echo "Site is available"
        
    - name: Performance check
      run: |
        echo "Basic performance check..."
        time curl -s -o /dev/null https://thedatawithjose.github.io
        echo "Performance check completed"
      continue-on-error: true