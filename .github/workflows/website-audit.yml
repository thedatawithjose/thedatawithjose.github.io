name: Website acceptance audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.audit.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: |
            audit-report/
            test-results/
          retention-days: 7
