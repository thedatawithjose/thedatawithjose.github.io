<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for the database layers matching the original image -->
    <linearGradient id="topLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DE9B6"/>
      <stop offset="50%" stop-color="#00BFA5"/>
      <stop offset="100%" stop-color="#00ACC1"/>
    </linearGradient>
    <linearGradient id="secondLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26C6DA"/>
      <stop offset="50%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#0097A7"/>
    </linearGradient>
    <linearGradient id="thirdLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="50%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <linearGradient id="bottomLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C6BC0"/>
      <stop offset="50%" stop-color="#3F51B5"/>
      <stop offset="100%" stop-color="#303F9F"/>
    </linearGradient>
    
    <!-- Shadow gradient -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.1)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  
  <!-- Background with subtle glow -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(29,233,182,0.1)" stroke-width="1"/>
  
  <!-- Database stack centered -->
  <g transform="translate(100,100)">
    <!-- Shadow base -->
    <ellipse cx="0" cy="45" rx="50" ry="12" fill="url(#shadow)" opacity="0.3"/>
    
    <!-- Bottom layer (darkest blue) -->
    <g>
      <!-- Side -->
      <rect x="-45" y="20" width="90" height="20" fill="url(#bottomLayer)" opacity="0.95"/>
      <!-- Bottom ellipse -->
      <ellipse cx="0" cy="40" rx="45" ry="12" fill="url(#bottomLayer)" opacity="0.8"/>
      <!-- Top ellipse -->
      <ellipse cx="0" cy="20" rx="45" ry="12" fill="url(#bottomLayer)"/>
      <!-- Highlight dots -->
      <circle cx="-20" cy="20" r="1" fill="rgba(255,255,255,0.6)"/>
      <circle cx="15" cy="22" r="0.8" fill="rgba(255,255,255,0.4)"/>
    </g>
    
    <!-- Third layer (medium blue) -->
    <g>
      <!-- Side -->
      <rect x="-45" y="0" width="90" height="20" fill="url(#thirdLayer)" opacity="0.95"/>
      <!-- Bottom ellipse -->
      <ellipse cx="0" cy="20" rx="45" ry="12" fill="url(#thirdLayer)" opacity="0.8"/>
      <!-- Top ellipse -->
      <ellipse cx="0" cy="0" rx="45" ry="12" fill="url(#thirdLayer)"/>
      <!-- Highlight dots -->
      <circle cx="-25" cy="2" r="1" fill="rgba(255,255,255,0.6)"/>
      <circle cx="20" cy="1" r="0.8" fill="rgba(255,255,255,0.4)"/>
    </g>
    
    <!-- Second layer (light blue) -->
    <g>
      <!-- Side -->
      <rect x="-45" y="-20" width="90" height="20" fill="url(#secondLayer)" opacity="0.95"/>
      <!-- Bottom ellipse -->
      <ellipse cx="0" cy="0" rx="45" ry="12" fill="url(#secondLayer)" opacity="0.8"/>
      <!-- Top ellipse -->
      <ellipse cx="0" cy="-20" rx="45" ry="12" fill="url(#secondLayer)"/>
      <!-- Highlight dots -->
      <circle cx="-15" cy="-18" r="1" fill="rgba(255,255,255,0.6)"/>
      <circle cx="25" cy="-19" r="0.8" fill="rgba(255,255,255,0.4)"/>
    </g>
    
    <!-- Top layer (teal/green) -->
    <g>
      <!-- Side -->
      <rect x="-45" y="-40" width="90" height="20" fill="url(#topLayer)" opacity="0.95"/>
      <!-- Bottom ellipse -->
      <ellipse cx="0" cy="-20" rx="45" ry="12" fill="url(#topLayer)" opacity="0.8"/>
      <!-- Top ellipse -->
      <ellipse cx="0" cy="-40" rx="45" ry="12" fill="url(#topLayer)"/>
      <!-- Highlight dots -->
      <circle cx="-30" cy="-38" r="1" fill="rgba(255,255,255,0.8)"/>
      <circle cx="10" cy="-39" r="0.8" fill="rgba(255,255,255,0.6)"/>
      <circle cx="35" cy="-37" r="0.6" fill="rgba(255,255,255,0.4)"/>
    </g>
  </g>
  
  <!-- Orbital connection lines and nodes -->
  <!-- Top right orbital -->
  <g>
    <path d="M 145,40 Q 170,30 180,50" stroke="#1DE9B6" stroke-width="1.5" fill="none" opacity="0.7" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" values="0;6" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="180" cy="50" r="4" fill="#1DE9B6" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Right orbital -->
  <g>
    <path d="M 145,100 Q 165,95 175,105" stroke="#26C6DA" stroke-width="1.5" fill="none" opacity="0.7" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;8" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <circle cx="175" cy="105" r="3.5" fill="#26C6DA" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Bottom right orbital -->
  <g>
    <path d="M 145,160 Q 165,170 170,150" stroke="#42A5F5" stroke-width="1.5" fill="none" opacity="0.7" stroke-dasharray="2,5">
      <animate attributeName="stroke-dashoffset" values="0;7" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="170" cy="150" r="4.5" fill="#42A5F5" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Left orbitals -->
  <g>
    <path d="M 55,70 Q 35,60 25,80" stroke="#5C6BC0" stroke-width="1.5" fill="none" opacity="0.7" stroke-dasharray="3,4">
      <animate attributeName="stroke-dashoffset" values="0;7" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <circle cx="25" cy="80" r="3" fill="#5C6BC0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g>
    <path d="M 55,130 Q 30,140 20,120" stroke="#00BFA5" stroke-width="1.5" fill="none" opacity="0.7" stroke-dasharray="5,3">
      <animate attributeName="stroke-dashoffset" values="0;8" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <circle cx="20" cy="120" r="4" fill="#00BFA5" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Top orbital -->
  <g>
    <path d="M 100,55 Q 90,25 110,20" stroke="#1DE9B6" stroke-width="1.5" fill="none" opacity="0.7" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" values="0;7" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <circle cx="110" cy="20" r="3.5" fill="#1DE9B6" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floating data particles -->
  <g opacity="0.6">
    <circle cx="70" cy="45" r="1.5" fill="#1DE9B6">
      <animate attributeName="cy" values="45;40;45" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="75" r="1" fill="#26C6DA">
      <animate attributeName="cy" values="75;70;75" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="130" r="1.2" fill="#42A5F5">
      <animate attributeName="cy" values="130;125;130" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="160" r="1" fill="#5C6BC0">
      <animate attributeName="cy" values="160;155;160" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>